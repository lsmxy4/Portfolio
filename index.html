<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>신동환 | Backend Developer Portfolio</title>

    <meta
      name="description"
      content="웹 개발 경험을 바탕으로 백엔드 개발자를 목표로 성장하는 신동환의 포트폴리오입니다."

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="신동환 | Backend Developer Portfolio" />
    <meta
      property="og:description"
      content="React 기반 프로젝트와 다양한 웹 개발 경험을 담은 포트폴리오입니다."

    <meta
      property="og:image"
      content="https://portfolio-lsmxy4s-projects.vercel.app/meta.png"

      property="og:url"
      content="https://portfolio-lsmxy4s-projects.vercel.app/"
    />
    <meta property="og:site_name" content="신동환 Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="신동환 | Backend Developer Portfolio"
    />

      name="twitter:description"

    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      } catch { /* 기본 다크 테마 유지 */ }
    </script>
    <!-- Theme -->
    <meta name="theme-color" content="#0b111b" />
